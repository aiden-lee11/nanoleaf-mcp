[project]
name = "nanoleaf-mcp"
version = "0.2.0"
description = "MCP server + CLI that lets an AI agent control Nanoleaf light panels: presets, palette effects, layout-agnostic scenes and games, multi-controller sync, clap triggers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["nanoleaf", "mcp", "smart-lights", "agent", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
sound = ["sounddevice>=0.5", "numpy>=1.26"]

[project.scripts]
nanoleaf = "nanoleaf_mcp.cli:main"
nanoleaf-mcp = "nanoleaf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoleaf_mcp"]
